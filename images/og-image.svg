    <circle cx="0" cy="0" r="80" fill="none" stroke="#BF9B30" stroke-width="0.6"/>
    <line x1="0" y1="-280" x2="0" y2="280" stroke="#BF9B30" stroke-width="0.4"/>
    <line x1="-280" y1="0" x2="280" y2="0" stroke="#BF9B30" stroke-width="0.4"/>
  </g>

