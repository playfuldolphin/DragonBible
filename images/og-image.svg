  <text x="960" y="280" font-family="Georgia, serif" font-size="11" fill="#BF9B30" opacity="0.4" letter-spacing="2">MS-019-PSA</text>
  <text x="960" y="300" font-family="Georgia, serif" font-size="11" fill="#BF9B30" opacity="0.4" letter-spacing="2">MS-027-REV</text>
